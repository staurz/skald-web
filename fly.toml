# fly.toml app configuration file generated for arctic-spa on 2026-05-13T08:55:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arctic-spa'
primary_region = 'arn'

[build]

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
