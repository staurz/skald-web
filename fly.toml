app = "skald"
primary_region = "arn"

[build]

[env]
  NODE_ENV = "production"
  # Cap V8's old-space heap below the 256mb cgroup limit so it GCs
  # instead of getting OOM-killed. Leaves headroom for Node baseline,
  # new-space, and native modules (better-sqlite3). Raise with memory.
  NODE_OPTIONS = "--max-old-space-size=160"

[[mounts]]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
